<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Direction C — Triage Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* =====================================================================
   DIRECTION C — "TRIAGE DESK"
   An operator's workbench for growth teams and agencies. No sidebar:
   a matte top bar carries the five sections; the page is a split
   desk — a dense, sortable gap queue on the left and a docked
   inspector on the right that always shows the selected gap's
   evidence. Severity is a rail (thickness + code), not a colour wash.
   Motion is short and mechanical: selection slides, panels dock.
   ===================================================================== */
:root{
  --bg:#FAFAF8; --surface:#FFFFFF; --sunk:#F2F2EF; --line:#E4E3DE; --line-2:#CFCEC7;
  --bar:#17191C; --bar-2:#25282D; --bar-ink:#E9E9E6; --bar-mute:#A3A6AB;
  --ink:#16181B; --ink-2:#44474D; --ink-3:#64676D;
  --you:#E8661A; --you-ink:#A6470B; --you-wash:#FDEEE3;
  --dec:#C0390F; --dec-wash:#FCEAE3;
  --con:#9C6200; --con-wash:#FAF0DC;
  --dis:#56627A; --dis-wash:#ECEEF3;
  --work:#1F55C4; --work-wash:#E7EEFC;
  --ok:#1C7A4A; --ok-wash:#E2F3E9;
  --obs:#0A6B66; --obs-wash:#DCF1EF;
  --unsure:#64676D; --unsure-wash:#EFEFEC;
  --fault:#4B4E54; --fault-wash:#E8E8E6;
  --f-ui:"IBM Plex Sans",ui-sans-serif,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:20px;--s6:24px;
  --r1:4px;--r2:8px;
  --e1:0 0 0 1px var(--line);
  --e2:0 0 0 1px var(--line),0 16px 40px -20px rgba(22,24,27,.35);
  --focus:0 0 0 2px var(--surface),0 0 0 4px var(--work);
  --ease:cubic-bezier(.3,.7,.2,1); --d1:120ms; --d2:180ms; --d3:260ms;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 13.5px/1.45 var(--f-ui);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:none;box-shadow:var(--focus);border-radius:var(--r1)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.mono{font-family:var(--f-mono);font-size:12px}
.tnum{font-variant-numeric:tabular-nums}
svg.i{width:14px;height:14px;flex:none}
.kbd{font:500 10.5px var(--f-mono);padding:1px 5px;border-radius:3px;box-shadow:inset 0 0 0 1px var(--line-2);color:var(--ink-3);background:var(--surface)}

/* top bar with grouped nav */
.bar{background:var(--bar);color:var(--bar-ink);display:flex;align-items:stretch;height:52px;padding:0 16px;gap:4px;position:sticky;top:0;z-index:10}
.logo{display:flex;align-items:center;gap:8px;font-weight:600;white-space:nowrap;padding-right:14px;border-right:1px solid var(--bar-2);margin-right:8px}
.logo svg{width:26px;height:14px}
.bsel{display:flex;align-items:center;gap:8px;padding:0 12px;white-space:nowrap;border:0;background:none;color:var(--bar-ink);cursor:pointer;border-right:1px solid var(--bar-2);margin-right:6px}
.bsel .m{width:22px;height:22px;border-radius:5px;background:var(--you);color:#1a0d03;font-weight:700;font-size:11px;display:grid;place-items:center}
.bsel span span{display:block;font-size:10.5px;color:var(--bar-mute)}
.grp{display:flex;align-items:center;gap:2px;padding:0 6px;position:relative}
.grp+.grp{border-left:1px solid var(--bar-2)}
.grp>span{font:500 9.5px var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--bar-mute);margin-right:4px}
.grp a{padding:6px 7px;border-radius:5px;text-decoration:none;color:#D4D5D2;font-size:12.5px;white-space:nowrap;display:flex;gap:6px;align-items:center}
.grp a:hover{background:var(--bar-2);color:#fff}
.grp a[aria-current]{background:#F3F2EE;color:var(--ink);font-weight:600}
.grp a .ct{font:500 10.5px var(--f-mono);color:var(--bar-mute)}
.grp a[aria-current] .ct{color:var(--ink-3)}
.bar .sp{flex:1}
.acct{display:flex;align-items:center;gap:8px;border:0;background:none;color:var(--bar-ink);cursor:pointer;padding:0 4px 0 12px;border-left:1px solid var(--bar-2)}
.acct .av{width:26px;height:26px;border-radius:50%;background:#3A3E44;display:grid;place-items:center;font-size:11px;font-weight:600}

/* situation strip */
.sit{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;padding:16px 20px 12px;background:var(--surface);border-bottom:1px solid var(--line)}
.sit h1{margin:0;font:600 20px/1.3 var(--f-ui);letter-spacing:-.01em}
.sit h1 .d{background:var(--dec-wash);color:var(--dec);padding:0 5px;border-radius:3px}
.scope{display:flex;flex-wrap:wrap;gap:0;margin-top:8px;font:500 11.5px var(--f-mono);color:var(--ink-2)}
.scope span{padding:0 10px;border-left:1px solid var(--line-2)}
.scope span:first-child{padding-left:0;border-left:0}
.scope .f{color:var(--fault);display:inline-flex;gap:5px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:var(--r1);border:0;background:var(--ink);color:#fff;font-weight:500;font-size:12.5px;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn.ghost{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line-2)}
.btn.sm{height:26px;padding:0 9px;font-size:12px}
.btn.pri{background:var(--work)}
.acts{display:flex;gap:8px;align-items:center}

/* decision strip: four meters in one instrument */
.meters{display:grid;grid-template-columns:1.1fr 1.3fr 1fr 1fr;background:var(--surface);border-bottom:1px solid var(--line)}
.mt{padding:10px 20px 12px;display:flex;flex-direction:column;gap:5px;border-left:1px solid var(--line);text-decoration:none;min-width:0}
.mt:first-child{border-left:0}
.mt .h{display:flex;align-items:baseline;gap:8px;font:500 10.5px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.mt .h b{margin-left:auto;font:600 19px var(--f-ui);letter-spacing:-.01em;color:var(--ink);text-transform:none}
.mt .h b small{font-size:12px;color:var(--ink-3);font-weight:500}
.mt p{margin:0;font-size:12px;color:var(--ink-2)}
.seg{display:flex;gap:1px;height:8px}
.seg i{flex:1;background:var(--sunk)}
.seg i.y{background:var(--you)}
.seg i.d{background:var(--dec)}
.seg i.c{background:var(--con)}
.seg i.x{background:repeating-linear-gradient(90deg,var(--dis) 0 2px,transparent 2px 4px)}
.mt.hot{background:linear-gradient(180deg,var(--dec-wash),var(--surface))}
.mt.hot .h b{color:var(--dec)}
.mt.act .h b{color:var(--work)}

/* desk */
.desk{display:grid;grid-template-columns:minmax(0,1fr) 500px}
.q{border-right:1px solid var(--line);min-width:0;display:flex;flex-direction:column}
.qh{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--surface);flex-wrap:wrap}
.qh h2{margin:0 6px 0 0;font:600 14px var(--f-ui)}
.chip{white-space:nowrap;flex:none;height:26px;padding:0 9px;border-radius:999px;border:0;box-shadow:inset 0 0 0 1px var(--line-2);background:var(--surface);font-size:12px;display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;box-shadow:none}
.qh .sp{flex:1}
.qh .hint{font-size:11.5px;color:var(--ink-3);display:flex;gap:6px;align-items:center}
table{width:100%;border-collapse:collapse}
th{font:500 10.5px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--sunk);white-space:nowrap;position:sticky;top:52px}
th.sorted::after{content:" ↓";color:var(--ink)}
td{padding:10px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr.r{cursor:pointer;transition:background var(--d1)}
tr.r:hover td{background:#F6F6F3}
tr.r[aria-selected="true"] td{background:var(--work-wash)}
tr.r[aria-selected="true"] td:last-child{box-shadow:inset -3px 0 0 var(--work)}
td.rail{width:0;padding:0;position:relative}
td.rail i{position:absolute;left:0;top:0;bottom:0;background:var(--dec)}
tr.decision td.rail i{width:5px;background:var(--dec)}
tr.consideration td.rail i{width:3px;background:var(--con)}
tr.discovery td.rail i{width:1px;background:var(--dis)}
.code{display:inline-flex;align-items:center;gap:4px;font:600 10.5px var(--f-mono);letter-spacing:.04em;padding:2px 6px;border-radius:3px}
.code.decision{background:var(--dec-wash);color:var(--dec)}
.code.consideration{background:var(--con-wash);color:var(--con)}
.code.discovery{background:var(--dis-wash);color:var(--dis)}
.qt{font-weight:600;line-height:1.35}
.sub{font-size:11.5px;color:var(--ink-3);margin-top:2px}
.cells{display:inline-flex;gap:3px}
.cl{width:22px;height:18px;border-radius:3px;display:grid;place-items:center;font:600 9.5px var(--f-mono)}
.cl.n{background:var(--you);color:#1a0d03}
.cl.a{box-shadow:inset 0 0 0 1.5px var(--ink-2);color:var(--ink-2)}
.cl.f{background:repeating-linear-gradient(-45deg,var(--fault-wash) 0 3px,var(--surface) 3px 6px);box-shadow:inset 0 0 0 1px var(--fault);color:var(--fault)}
.comp{font-size:12.5px;white-space:nowrap}
.comp b{font-weight:600}
.comp .m{font:500 11px var(--f-mono);color:var(--ink-3)}
.evc{font:500 12px var(--f-mono);white-space:nowrap}
.evc .z{color:var(--dec)}
.conf{display:inline-flex;gap:5px;align-items:center;font-size:11.5px;color:var(--ink-2);white-space:nowrap}
.bars{display:inline-flex;gap:1.5px;align-items:flex-end}.bars i{width:3px;background:var(--ink-2)}.bars i:nth-child(1){height:5px}.bars i:nth-child(2){height:8px}.bars i:nth-child(3){height:11px}.bars i.o{background:var(--line-2)}
.conf.low{padding:1px 6px;border:1px dashed var(--line-2);border-radius:3px;background:var(--unsure-wash);color:var(--unsure)}
.st{display:inline-flex;gap:5px;align-items:center;font-size:12px;font-weight:500;white-space:nowrap}
.st.work{color:var(--work)}.st.ok{color:var(--ok)}.st.obs{color:var(--obs)}.st.arch{color:var(--ink-3)}
.more{padding:10px 16px;font-size:12px;color:var(--ink-3);display:flex;gap:8px;align-items:center}
.fail-row td{background:repeating-linear-gradient(-45deg,var(--surface) 0 8px,#F7F7F5 8px 16px)}

/* recovery status line (footer pipeline) */
.pipe{border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--surface);padding:12px 16px;margin-top:8px}
.pipe .h{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.pipe .h b{font-size:13px}
.pipe .h .sp{flex:1}
.pl{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:3px}
.pl div{padding:6px 8px;background:var(--sunk);font-size:11.5px;display:flex;flex-direction:column;gap:1px;position:relative;clip-path:polygon(0 0,calc(100% - 7px) 0,100% 50%,calc(100% - 7px) 100%,0 100%,7px 50%)}
.pl div:first-child{clip-path:polygon(0 0,calc(100% - 7px) 0,100% 50%,calc(100% - 7px) 100%,0 100%)}
.pl b{font:600 15px var(--f-ui)}
.pl .w{background:var(--work-wash);color:var(--work)}
.pl .k{background:var(--ok-wash);color:var(--ok)}
.pl .o{background:var(--obs);color:#fff}
.pl .a{background:var(--sunk);color:var(--ink-3)}
.pl span{color:inherit;opacity:.95;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:6px}
.pl b{padding-left:6px}
.pipe .note{margin-top:8px;font-size:12px;color:var(--ink-2);display:flex;gap:6px;align-items:center}

/* inspector */
.ins{background:var(--surface);min-width:0;display:flex;flex-direction:column;position:sticky;top:52px;align-self:start;max-height:calc(100vh - 52px);overflow:auto;animation:dock var(--d3) var(--ease) both}
@keyframes dock{from{opacity:0;transform:translateX(12px)}}
.ih{padding:14px 18px 0;border-bottom:1px solid var(--line)}
.ih .t{display:flex;gap:8px;align-items:center}
.ih .t .sp{flex:1}
.ih h2{margin:8px 0 4px;font:600 16px/1.3 var(--f-ui)}
.itabs{display:flex;gap:0;margin-top:10px}
.itabs button{border:0;background:none;padding:8px 10px;font-size:12.5px;font-weight:500;color:var(--ink-3);border-bottom:2px solid transparent;cursor:pointer;display:flex;gap:6px;align-items:center}
.itabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.itabs .n{font:500 10.5px var(--f-mono);color:var(--ink-3)}
.ib{padding:14px 18px;display:flex;flex-direction:column;gap:14px}
.lbl{font:500 10.5px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);display:flex;gap:6px;align-items:center}
.lbl .obsk{background:var(--ink);color:#fff;padding:1px 5px;border-radius:2px;letter-spacing:.04em}
.lbl .infk{background:var(--work-wash);color:var(--work);padding:1px 5px;border-radius:2px}
.ans{font-size:13px;line-height:1.6;padding:10px 12px;background:var(--sunk);border-radius:var(--r1);border-left:3px solid var(--ink-2)}
.ans p{margin:0 0 6px}
.ans m{font-weight:600;background:#E6E6E2;padding:0 2px;border-radius:2px}
.miss{display:flex;gap:6px;align-items:center;font-weight:600;font-size:12.5px;color:var(--you-ink)}
.cmpt{width:100%;font-size:12.5px}
.cmpt th{position:static;background:none;padding:6px 8px;border-bottom:1px solid var(--line-2)}
.cmpt td{padding:7px 8px;border-bottom:1px solid var(--line)}
.cmpt td:first-child{color:var(--ink-2)}
.cmpt .you{background:var(--you-wash)}
.cmpt th.you{color:var(--you-ink)}
.yes{display:inline-flex;gap:4px;align-items:center;font-weight:600}
.no{display:inline-flex;gap:4px;align-items:center;color:var(--ink-3)}
.srow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:12px}
.srow .u{font:500 11.5px var(--f-mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .w{grid-column:1/-1;display:flex;gap:10px;color:var(--ink-2)}
.srow.blk .u{color:var(--fault)}
.inf{padding:10px 12px;border-radius:var(--r1);background:var(--work-wash);font-size:12.5px}
.actbox{border:1px solid var(--line-2);border-radius:var(--r2);padding:12px;display:flex;flex-direction:column;gap:8px}
.actbox .r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.actbox p{margin:0;font-size:12px;color:var(--ink-2)}
.ifoot{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--line);background:var(--surface);position:sticky;bottom:0}

/* expanded evidence drawer (focus mode) */
.scrim{position:fixed;inset:52px 0 0 0;background:rgba(22,24,27,.35);opacity:0;pointer-events:none;transition:opacity var(--d2)}
body.focus .scrim{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:52px;right:0;bottom:0;width:min(940px,100%);background:var(--surface);box-shadow:var(--e2);transform:translateX(100%);transition:transform var(--d3) var(--ease);z-index:20;display:flex;flex-direction:column}
body.focus .drawer{transform:none}
.dgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);flex:1;overflow:auto}
.dgrid>div{padding:14px 18px;display:flex;flex-direction:column;gap:14px}
.dgrid>div+div{border-left:1px solid var(--line)}

/* recovery board */
.board{display:grid;gap:6px!important;grid-template-columns:repeat(8,minmax(116px,1fr));gap:8px;padding:14px 16px;align-items:start;overflow-x:auto}
.col{background:var(--sunk);border-radius:var(--r2);padding:8px;display:flex;flex-direction:column;gap:6px;min-width:0;min-height:300px}
.col.archive{background:repeating-linear-gradient(-45deg,var(--sunk) 0 8px,#EFEFEC 8px 16px)}
.ch{display:flex;align-items:center;gap:6px;font:600 11.5px var(--f-ui);padding:2px 2px 4px}
.ch .n{margin-left:auto;font:500 11px var(--f-mono);color:var(--ink-3)}
.ch.work{color:var(--work)}.ch.ok{color:var(--ok)}.ch.obs{color:var(--obs)}.ch.arch{color:var(--ink-3)}
.card{background:var(--surface);border-radius:var(--r1);box-shadow:var(--e1);padding:8px 9px 8px 12px;display:flex;flex-direction:column;gap:5px;font-size:12px;position:relative;cursor:pointer;border:0;text-align:left;width:100%}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;border-radius:var(--r1) 0 0 var(--r1)}
.card.decision::before{width:4px;background:var(--dec)}
.card.consideration::before{width:2.5px;background:var(--con)}
.card.discovery::before{width:1px;background:var(--dis)}
.card b{font-weight:600;line-height:1.3}
.card .m{display:flex;gap:6px;align-items:center;color:var(--ink-3);font-size:11px;flex-wrap:wrap}
.card .m:first-child{flex-wrap:nowrap;white-space:nowrap;overflow:hidden}
.card .m:first-child>span:last-child{overflow:hidden;text-overflow:ellipsis}
.card[aria-selected="true"]{box-shadow:0 0 0 2px var(--work)}
.card .res{font:600 11.5px var(--f-mono);color:var(--obs)}
.ticks{display:flex;gap:2px}.ticks i{flex:1;height:3px;background:var(--line)}.ticks i.on{background:var(--ink-2)}
.detail{position:fixed;top:52px;right:0;bottom:0;width:400px;background:var(--surface);box-shadow:var(--e2);display:flex;flex-direction:column;z-index:15}
.detail .ib dl{display:grid;grid-template-columns:110px 1fr;gap:6px 10px;margin:0;font-size:12.5px}
.detail dt{color:var(--ink-3)}.detail dd{margin:0}
.draft{display:flex;gap:8px;padding:10px;border:1px dashed var(--line-2);border-radius:var(--r1);background:var(--sunk);font-size:12px}
.draft b{display:block}
.rechead{padding:16px 20px 12px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;gap:16px;align-items:flex-end}
.rechead h1{margin:0;font:600 20px/1.3 var(--f-ui)}
.rechead .sp{flex:1}

/* mobile */
.mbar,.mtabs{display:none}
@media (max-width:760px){
  .bar{display:none}
  .mbar{display:flex;align-items:center;gap:10px;padding:0 14px;height:50px;background:var(--bar);color:var(--bar-ink);position:sticky;top:0;z-index:10}
  .mbar .m{width:24px;height:24px;border-radius:5px;background:var(--you);color:#1a0d03;font-weight:700;font-size:11px;display:grid;place-items:center}
  .mbar b{font-size:14px}.mbar .s{font-size:10.5px;color:var(--bar-mute);display:block}.mbar .sp{flex:1}
  .sit{grid-template-columns:1fr;padding:14px 16px}
  .sit h1{font-size:17px}
  .sit .acts{display:none}
  .scope{gap:4px 0}
  .meters{grid-template-columns:1fr 1fr}
  .mt{padding:10px 16px}
  .mt:nth-child(3){border-left:0}
  .mt:nth-child(n+3){border-top:1px solid var(--line)}
  .mt .h{flex-wrap:wrap}
  .mt .h b{margin-left:0;flex-basis:100%;font-size:18px}
  .desk{grid-template-columns:1fr}
  .ins{display:none}
  .qh .hint{display:none}
  .qh{padding:10px 16px;overflow-x:auto;flex-wrap:nowrap}
  table thead{display:none}
  table,tbody{display:block}
  tr.r{display:grid;grid-template-columns:5px minmax(0,1fr) auto;border-bottom:1px solid var(--line);background:var(--surface);padding:10px 14px 10px 0;gap:4px 12px}
  tr.r td{border:0;padding:0;background:none!important;box-shadow:none!important}
  tr.r td.rail{grid-row:1/5;position:relative}
  tr.r td.rail i{position:absolute}
  tr.r td:nth-child(2){grid-column:2/4}
  tr.r td:nth-child(3){grid-column:2}
  tr.r td:nth-child(4){grid-column:3;text-align:right}
  tr.r td:nth-child(5){grid-column:2}
  tr.r td:nth-child(6){grid-column:3;text-align:right}
  tr.r td:nth-child(7){grid-column:2/4}
  tr.r[aria-selected="true"]{background:var(--work-wash)}
  .pl{grid-template-columns:repeat(4,minmax(0,1fr))}

    return '<section class="sit"><div><h1>Saarvi Skin was left out of <span class="d">9 decision-stage answers</span> in this check — Dermaroot was recommended in 7 of them.</h1>'+
        '<div class="scope" aria-label="Scope"><span>ChatGPT · Gemini · Perplexity</span><span>Checked 9 Oct 2026</span><span>India</span><span>18 buyer questions</span><span>51 of 54 answers completed</span><span class="f">'+ic('fault')+'3 Gemini not collected — excluded, not gaps</span></div></div>'+
        '<div class="acts"><button class="btn ghost">Methodology</button><button class="btn ghost">Export client report</button><button class="btn">Recheck recommendations</button></div></section>'+
      '<section class="meters" aria-label="Decision summary">'+
        '<a class="mt" href="#"><span class="h">Coverage<b class="tnum">12<small>/51</small></b></span><span class="seg" aria-hidden="true">'+seg(12,51,'y')+'</span><p>Named in 24% of completed answers · ↑ from 9/51 (25 Sep)</p></a>'+
        '<a class="mt hot" href="#"><span class="h">High-intent gaps<b class="tnum">25</b></span><span class="seg" aria-hidden="true">'+seg(9,9,'d')+seg(16,16,'c')+seg(14,14,'x')+'</span><p>'+ic('decision','color:var(--dec);width:12px;vertical-align:-2px')+' 9 decision · '+ic('consideration','color:var(--con);width:12px;vertical-align:-2px')+' 16 consideration · 14 discovery not counted</p></a>'+
        '<a class="mt" href="#"><span class="h">Most frequent alternative<b>Dermaroot</b></span><p>In 27 of 39 answers where Saarvi was absent</p></a>'+
        '<a class="mt act" href="#"><span class="h">Actions ready<b class="tnum">6</b></span><p>4 suggested · 2 drafts awaiting review</p></a></section>'+
      '<div class="desk"><section class="q" aria-label="Priority gaps"><div class="qh"><h2>Priority gaps</h2><button class="chip" aria-pressed="true">All 39</button><button class="chip" aria-pressed="false">'+ic('decision','color:var(--dec)')+'Decision 9</button><button class="chip" aria-pressed="false">'+ic('consideration','color:var(--con)')+'Consideration 16</button><button class="chip" aria-pressed="false">'+ic('discovery','color:var(--dis)')+'Discovery 14</button><button class="chip" aria-pressed="false">Engine ▾</button><button class="chip" aria-pressed="false">Competitor ▾</button><span class="sp"></span><span class="hint"><span class="kbd">J</span><span class="kbd">K</span> move · <span class="kbd">E</span> evidence · <span class="kbd">A</span> action</span></div>'+
        '<table><thead><tr><th class="rail"></th><th class="sorted">Buyer question · intent</th><th>Engines</th><th>Shown instead</th><th>Evidence</th><th>Confidence</th><th>Recovery</th></tr></thead><tbody>'+rows+
        '<tr class="fail-row"><td class="rail"></td><td colspan="6"><span class="st arch" style="color:var(--fault)">'+ic('fault')+'3 answers could not be collected (Gemini, timeout).</span> <span class="sub" style="display:inline">They are excluded from coverage and never shown as gaps.</span></td></tr></tbody></table>'+
        '<div class="more">Showing 5 of 39 · sorted by intent, then competitor frequency, then confidence · <a href="#" style="color:var(--work)">Open all recommendation gaps</a></div>'+
        '<div class="pipe"><div class="h"><b>Recovery path</b><span class="mono" style="color:var(--ink-3)">12 actions</span><span class="sp"></span><a href="#" data-v="recovery" style="color:var(--work);font-size:12.5px">Open recovery plan →</a></div><div class="pl" role="list" aria-label="Recovery lifecycle">'+pl+'</div>'+
        '<div class="note">'+ic('obs','color:var(--obs)')+'<span><b>Result observed:</b> sunscreen FAQ page, 0/3 → 1/3 (25 Sep → 9 Oct). Observed association, not proof of cause.</span></div>'+
        '<div class="note" style="margin-top:4px">'+ic('work','color:var(--work)')+'<span>Since 25 Sep (comparable): <b>2</b> recovered · <b>3</b> new · <b>1</b> regressed · <b>36</b> unchanged</span></div></div>'+
      '</section><aside class="ins" aria-label="Evidence inspector">'+inspector(g0)+'</aside></div>';
  }
  function drawer(){
    var g=D.priority[0];
    return '<div class="ih"><div class="t">'+code('decision',true)+conf('high')+'<span class="sp"></span><button class="btn ghost sm" data-close aria-label="Close evidence">'+ic('x')+'Close</button></div><h2 id="dtitle">“'+g.q+'”</h2><div class="mono" style="color:var(--ink-3)">ChatGPT · Gemini · Perplexity · 9 Oct 2026 · India · 3/3 completed</div>'+
      '<div class="itabs" role="tablist"><button role="tab" aria-selected="true">Evidence</button><button role="tab" aria-selected="false">All answers <span class="n">3</span></button><button role="tab" aria-selected="false">Methodology</button></div></div>'+
      '<div class="dgrid"><div><div class="lbl"><span class="obsk">OBSERVED</span>ChatGPT · '+D.answer.time+'</div><div class="ans">'+D.answer.paras.map(function(p){return '<p>'+p+'</p>'}).join('')+'</div><div class="miss">'+ic('n')+'Saarvi Skin not named in this answer</div>'+
        '<div><div class="lbl" style="margin-bottom:4px"><span class="obsk">OBSERVED</span>Your page · saarviskin.com/products/vitamin-c-serum</div>'+D.facts.map(function(f){return '<div style="display:flex;gap:6px;font-size:12.5px;padding:2px 0">'+(f[1]==='ok'?ic('y','color:var(--ok)'):ic('n','color:var(--dec)'))+f[0]+'</div>'}).join('')+'</div></div>'+
      '<div><div><div class="lbl" style="margin-bottom:2px"><span class="obsk">OBSERVED</span>Cited sources · 5 of 7</div>'+D.srcRows.map(function(s){var bl=s.insp.indexOf('Could')===0;var m=function(v,n){return v==='no'?'<span class="no">'+ic('n')+n+'</span>':'<span class="yes">'+ic('y')+n+(v==='owner'?' (own)':v==='once'?' (1 reply)':'')+'</span>'};return '<div class="srow'+(bl?' blk':'')+'"><span class="u">'+s.url+'</span><span class="mono" style="color:var(--ink-3)">'+s.kind+' · '+s.cited+'</span><span class="w">'+m(s.d,'Dermaroot')+m(s.c,'Clearlab')+m(s.you,'Saarvi')+(bl?'<span style="color:var(--fault);margin-left:auto">'+ic('fault')+' not inspected</span>':'')+'</span></div>'}).join('')+'</div>'+
        compare()+'<div class="inf"><div class="lbl" style="margin-bottom:4px"><span class="infk">INFERENCE · HIGH</span></div>Shortlists come from roundups that state price and skin type. Saarvi’s ₹699 serum fits but isn’t in them. Interpretation of observed evidence — not a prediction.</div></div></div>'+
      '<div class="ifoot"><button class="btn pri">Open draft A-104 for review</button><button class="btn ghost">Pursue inclusion on skinroutine.in</button><span style="flex:1"></span><span style="font-size:11.5px;color:var(--ink-3)">May strengthen evidence; does not guarantee inclusion.</span></div>';
  }
  function recovery(){
    var order=['suggested','drafting','review','approved','published','recheck','observed','archived'];
    var cols=D.lifecycle.map(function(s){
      var items=D.board.filter(function(b){return b.st===s[0]});
      return '<section class="col'+(s[0]==='archived'?' archive':'')+'" aria-label="'+s[1]+'"><div class="ch '+ST[s[0]][1]+'">'+ic(ST[s[0]][2])+s[1]+'<span class="n">'+items.length+'</span></div>'+items.map(function(b){
        var idx=order.indexOf(b.st);
        return '<button class="card '+b.gap+'" type="button" aria-selected="'+(b.id==='A-104')+'"><span class="m"><span class="mono">'+b.id+'</span>'+code(b.gap)+'<span>'+b.kind+'</span></span><b>'+b.t+'</b>'+
          (b.st==='observed'?'<span class="res">'+b.note.split(' · ')[0]+'</span><span class="m">'+b.note.split(' · ')[1]+' · association only</span>':'')+
          '<span class="m">'+(b.owner?b.owner+(b.due?' · due '+b.due:(b.note?' · '+b.note:'')):(b.st!=='observed'&&b.note?b.note:(b.st==='observed'?'':'Unassigned')))+(b.conf==='low'?' '+conf('low'):'')+'</span>'+
          (b.st!=='archived'?'<span class="ticks" aria-hidden="true">'+order.slice(0,7).map(function(_,k){return '<i class="'+(k<=idx?'on':'')+'"></i>'}).join('')+'</span>':'')+'</button>';
      }).join('')+'</section>';
    }).join('');
    return '<section class="rechead"><div><div class="mono" style="color:var(--ink-3)">Recovery plan · actions from checks of 12 Sep – 9 Oct 2026 · India</div><h1>2 drafts for decision gaps are waiting on review.</h1></div><span class="sp"></span><div class="acts"><button class="chip" aria-pressed="true">Board</button><button class="chip" aria-pressed="false">Priority list</button><button class="btn">New recovery action</button></div></section>'+
      '<div class="board" style="margin-right:400px">'+cols+'</div>'+
      '<aside class="detail" aria-label="Action detail"><div class="ih"><div class="t"><span class="mono" style="color:var(--ink-3)">A-104</span>'+st('review')+code('decision',true)+'<span class="sp"></span><button class="btn ghost sm" aria-label="Close detail">'+ic('x')+'</button></div><h2>Vitamin C serum evidence page — draft v2</h2><div class="sub">For “Best vitamin C serum for oily skin under ₹800”</div>'+
        '<div class="itabs"><button aria-selected="true">Detail</button><button aria-selected="false">Evidence</button><button aria-selected="false">History</button></div></div>'+
        '<div class="ib"><dl><dt>Observed problem</dt><dd>Named in 0 of 3 answers (ChatGPT, Gemini, Perplexity · 9 Oct · India); Dermaroot in 3 of 3.</dd><dt>Intervention</dt><dd>Product evidence page: concentration, price, skin type and test results in text, plus Product schema.</dd><dt>Rationale</dt><dd>Addresses an observed evidence gap; may strengthen information available to AI systems; no guarantee of inclusion.</dd><dt>Owner · due</dt><dd>Rohan Mehta · 13 Oct</dd><dt>Approval</dt><dd>Awaiting an editor</dd><dt>Published URL</dt><dd style="color:var(--ink-3)">— add after it ships</dd><dt>Recheck</dt><dd style="color:var(--ink-3)">Scheduled on publish</dd><dt>Observed result</dt><dd style="color:var(--ink-3)">Needs a later comparable check</dd><dt>Confidence</dt><dd>'+conf('high')+' · 3 answers, 1 market</dd></dl>'+
        '<div class="draft">'+ic('doc')+'<span><b>Draft v2 — review before publishing</b>1,140 words · 3 [TODO] claims to verify</span></div></div>'+
        '<div class="ifoot"><button class="btn">Approve</button><button class="btn ghost">Back to drafting</button><button class="btn ghost">'+ic('arch')+'Archive</button></div></aside>';
  }
  var initial=new URLSearchParams(location.search).get('view')||'risk';
  function render(v){
    $('#page').innerHTML=v==='recovery'?recovery():risk();
    $('#mt').textContent=v==='recovery'?'Recovery plan':'Recommendation risk';
    document.querySelectorAll('.grp a').forEach(function(a){a.toggleAttribute('aria-current',a.getAttribute('data-v')===(v==='recovery'?'recovery':'risk'))});
    $('#m1').toggleAttribute('aria-current',v!=='recovery');$('#m2').toggleAttribute('aria-current',v==='recovery');
  }
  var lf;
  function openD(){lf=document.activeElement;$('#drawer').innerHTML=drawer();document.body.classList.add('focus');setTimeout(function(){var x=$('#drawer [data-close]');x&&x.focus()},60)}
  function closeD(){document.body.classList.remove('focus');lf&&lf.focus()}
  document.addEventListener('click',function(e){
    if(e.target.closest('[data-open]')){e.preventDefault();openD();return}
    if(e.target.closest('[data-close]')||e.target.id==='scrim'){closeD();return}
    var r=e.target.closest('tr.r');if(r){document.querySelectorAll('tr.r').forEach(function(x){x.setAttribute('aria-selected',x===r)});if(innerWidth<=760)openD()}
    var n=e.target.closest('[data-v]');if(n){e.preventDefault();render(n.getAttribute('data-v'))}
    if(e.target.closest('#m2')){e.preventDefault();render('recovery')} if(e.target.closest('#m1')){e.preventDefault();render('risk')}
  });
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape')closeD();
    if(e.key==='e'||e.key==='E'){if(!document.body.classList.contains('focus'))openD()}
    if(e.key==='j'||e.key==='k'){var rs=[].slice.call(document.querySelectorAll('tr.r'));var i=rs.findIndex(function(x){return x.getAttribute('aria-selected')==='true'});i=Math.max(0,Math.min(rs.length-1,i+(e.key==='j'?1:-1)));rs.forEach(function(x,k){x.setAttribute('aria-selected',k===i)});rs[i].focus()}
  });
  render(initial==='drawer'?'risk':initial);
  if(initial==='drawer')openD();
})();
</script>
</body>
</html>
